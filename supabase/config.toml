# Supabase Local Development Configuration
# https://supabase.com/docs/reference/cli/supabase-config

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[insecrets]
# Uncomment to enable Edge Functions
# enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = ["https://mnlawkpgeaqqmndffbav.supabase.co"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = true

# Uncomment to enable local OAuth for testing
# [auth.external.google]
# enabled = true